<!doctype html>
<html lang="ru" data-theme="neutral">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PS 2.0 — Parfum Selection</title>
    <meta name="description" content="Подбор парфюмерии по ощущениям. Не выбирай ноты — выбирай ощущения." />
    <meta name="theme-color" content="#0c0b0b" />
    <script>
      // Режим (мужской/женский) ставится до отрисовки, чтобы цвета не «перетекали» при загрузке.
      try {
        var saved = JSON.parse(localStorage.getItem('ps2-state'));
        if (saved && saved.gender) document.documentElement.dataset.theme = saved.gender;
      } catch (e) {}
    </script>
    <link rel="preload" href="../assets/fonts/cormorant-garamond-cyrillic-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../assets/fonts/onest-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/screens.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Перейти к содержанию</a>
    <header class="hdr">
      <div class="wrap hdr__inner">
        <a class="logo" href="#/" data-home aria-label="PS — Parfum Selection, к началу">
          <span class="logo__mark">PS.</span>
          <span class="logo__cap">Parfum Selection</span>
        </a>
        <div class="hdr__right">
          <div class="seg hdr__desk" role="group" aria-label="Язык описаний" data-hdr-lang>
            <button type="button" class="seg__btn" data-lang="plain">Просто</button>
            <button type="button" class="seg__btn" data-lang="expert">Нотами</button>
          </div>
          <div class="hdr__desk" data-hdr-gender hidden>
            <div class="seg" role="group" aria-label="Режим">
              <button type="button" class="seg__btn" data-gender="male">Мужское</button>
              <button type="button" class="seg__btn" data-gender="female">Женское</button>
            </div>
          </div>
          <button type="button" class="icon-btn" data-open="saved" aria-label="Сохранённое">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
            <span class="badge" data-saved-count hidden>0</span>
          </button>
          <button type="button" class="icon-btn hdr__mob" data-open="settings" aria-label="Настройки">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
          </button>
        </div>
      </div>
    </header>
    <main id="app" class="app" tabindex="-1">
      <div class="wrap screen"><p class="muted">Загружаем PS…</p></div>
    </main>
    <noscript><p class="wrap">Для подбора нужен включённый JavaScript.</p></noscript>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
