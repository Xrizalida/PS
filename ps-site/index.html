<!doctype html>
<html lang="ru" data-theme="neutral">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PS — Parfum Selection</title>
    <meta name="description" content="Персональный подбор парфюмерии по ощущениям. Не выбирай ноты — выбирай ощущения." />
    <script>
      // Тема выбранного пола ставится до отрисовки, чтобы при загрузке цвета не «перетекали» из нейтральной.
      try {
        var saved = JSON.parse(localStorage.getItem('ps-state'));
        if (saved && saved.gender) document.documentElement.dataset.theme = saved.gender;
      } catch (e) {}
    </script>
    <link rel="preload" href="./assets/fonts/cormorant-garamond-cyrillic-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/onest-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/app.css" />
    <link rel="stylesheet" href="./styles/animations.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Перейти к содержанию</a>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="logo" href="#/" data-home aria-label="PS — Parfum Selection, на главную">
          <span class="logo__mark">PS.</span>
          <span class="logo__caption">PARFUM SELECTION</span>
        </a>
        <div class="segmented" role="group" aria-label="Для кого подбираем" data-header-gender hidden>
          <button type="button" class="segmented__btn" data-gender="male">Мужчина</button>
          <button type="button" class="segmented__btn" data-gender="female">Женщина</button>
        </div>
      </div>
    </header>
    <main id="app" class="app" tabindex="-1">
      <div class="container screen"><p class="muted">Загружаем PS…</p></div>
    </main>
    <noscript><p class="container">Для подбора нужен включённый JavaScript.</p></noscript>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
